<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI JEWELRY CONCIERGE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.notice{background:#fff3cd;color:#664d03;padding:9px 12px;text-align:center;font-size:12px;font-weight:700}.header{background:#111;color:#fff;padding:23px 18px;text-align:center}.header h1{font-size:19px;letter-spacing:2px;margin:0 0 6px}.header p{font-size:12px;color:#ddd;margin:0}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 4px 18px #0000000a}h2{font-size:16px;margin:0 0 12px}.chatbox{display:flex;flex-direction:column;gap:12px;max-height:48vh;overflow-y:auto;padding:2px 1px 8px}.msg{display:flex;gap:8px;align-items:flex-start}.avatar{width:29px;height:29px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}.msg.user{flex-direction:row-reverse}.msg.user .avatar{background:#ddd;color:#222}.bubble{background:#f0f0f2;border-radius:4px 14px 14px 14px;padding:11px 12px;font-size:13px;line-height:1.65;max-width:86%;white-space:pre-line}.msg.user .bubble{background:#111;color:white;border-radius:14px 4px 14px 14px}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick button{border:1px solid #d7d7d7;background:white;border-radius:999px;padding:9px 12px;font-size:12px}.inputrow{display:flex;gap:7px;margin-top:13px}input{min-width:0;flex:1;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:14px}.send{border:0;border-radius:12px;background:#111;color:white;padding:0 17px;font-weight:700}.hint{font-size:11px;color:#777;line-height:1.6;margin:10px 0 0}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:8px}.resulthead span{font-size:11px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border:1px solid #e7e7e7;border-radius:14px;padding:10px;min-width:0}.visual{height:105px;border-radius:10px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:9px}.jewel{position:relative;width:70px;height:70px}.circle{width:48px;height:48px;border:7px solid #c8c8c8;border-radius:50%;position:absolute;left:11px;top:11px}.diamond{width:43px;height:43px;border:6px solid #c8c8c8;transform:rotate(45deg);position:absolute;left:14px;top:14px;border-radius:4px}.ring{width:54px;height:54px;border:9px solid #c8c8c8;border-radius:50%;position:absolute;left:8px;top:8px}.pearl{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd);box-shadow:0 0 0 3px #c8c8c8;position:absolute;left:17px;top:17px}.bar{width:67px;height:9px;border-radius:8px;background:#c8c8c8;position:absolute;left:1px;top:30px}.stone{width:34px;height:34px;background:#ddd;transform:rotate(45deg);position:absolute;left:18px;top:18px;border-radius:4px}.silver{filter:grayscale(1)}.pink{filter:hue-rotate(315deg) saturate(.55)}.match{position:absolute;right:6px;top:6px;background:#111;color:white;border-radius:999px;padding:4px 6px;font-size:9px;font-weight:700}.product h3{font-size:12px;line-height:1.45;margin:0 0 5px}.price{font-weight:700;font-size:14px;margin-bottom:5px}.meta{font-size:10px;color:#777;margin-bottom:7px}.reason{font-size:11px;color:#555;line-height:1.5}.actionrow{display:flex;gap:8px;margin-top:12px}.actionrow button{flex:1;border:1px solid #ddd;background:white;border-radius:10px;padding:10px;font-size:12px}.actionrow .primary{background:#111;color:#fff;border-color:#111}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="notice">⚠️ これはシステム提案用のデモです。商品情報・会話・分析結果はサンプルです。</div>
<header class="header"><h1>AI JEWELRY CONCIERGE</h1><p>会話しながら、あなたに合うジュエリーを探します</p></header>
<main class="wrap"><section class="card"><h2>💬 AIコンシェルジュ</h2><div id="chat" class="chatbox" aria-live="polite"></div><div id="quick" class="quick"></div><div class="inputrow"><input id="reply" placeholder="ここに希望を入力…" autocomplete="off"><button class="send" id="send">送信</button></div><p class="hint">文章で入力しても、選択肢をタップしても進められます。「最初から」でやり直せます。</p></section>
<section class="card" id="resultCard" style="display:none"><div class="resulthead"><h2>✨ AIおすすめジュエリー</h2><span id="count"></span></div><p id="summary" class="hint" style="margin:0 0 12px"></p><div id="grid" class="grid"></div><div class="actionrow"><button id="refine">希望を追加・変更</button><button class="primary" id="restart">最初から探す</button></div></section></main>
<script>
const products=[
{name:"シンプル ストーンネックレス",type:"ネックレス",color:"シルバー",design:"シンプル",scene:"普段使い",price:19800,shape:"diamond"},
{name:"ゴールド ミニリング",type:"リング",color:"ゴールド",design:"シンプル",scene:"普段使い",price:9800,shape:"ring"},
{name:"エレガント パールピアス",type:"ピアス",color:"シルバー",design:"上品",scene:"仕事・通勤",price:27500,shape:"pearl"},
{name:"ローズラインネックレス",type:"ネックレス",color:"ピンクゴールド",design:"上品",scene:"プレゼント",price:22800,shape:"circle"},
{name:"カジュアル バングル",type:"ブレスレット",color:"シルバー",design:"カジュアル",scene:"普段使い",price:12800,shape:"bar"},
{name:"クラシック ペンダント",type:"ネックレス",color:"ゴールド",design:"華やか",scene:"特別な日",price:32000,shape:"diamond"},
{name:"ミニパールリング",type:"リング",color:"ピンクゴールド",design:"上品",scene:"プレゼント",price:16800,shape:"pearl"},
{name:"スクエア ストーンピアス",type:"ピアス",color:"ゴールド",design:"華やか",scene:"特別な日",price:29800,shape:"stone"},
{name:"スリムゴールドバングル",type:"ブレスレット",color:"ゴールド",design:"シンプル",scene:"仕事・通勤",price:24800,shape:"bar"},
{name:"デイリーサークルピアス",type:"ピアス",color:"ピンクゴールド",design:"カジュアル",scene:"普段使い",price:8900,shape:"circle"},
{name:"クラシックリング",type:"リング",color:"シルバー",design:"上品",scene:"特別な日",price:35000,shape:"ring"},
{name:"ゴールドパールネックレス",type:"ネックレス",color:"ゴールド",design:"上品",scene:"プレゼント",price:29800,shape:"pearl"}];
const state={scene:"",design:"",color:"",type:"",budget:""};const steps=[
{key:"scene",question:"こんにちは！どんな場面で使うジュエリーをお探しですか？",options:["普段使い","仕事・通勤","プレゼント","特別な日","まだ決まっていない"]},
{key:"type",question:"ありがとうございます！どの種類が気になりますか？",options:["ネックレス","リング","ピアス","ブレスレット","まだ決まっていない"]},
{key:"design",question:"どんなデザインがお好みですか？",options:["シンプル","上品","カジュアル","華やか","まだ決まっていない"]},
{key:"color",question:"お好みのカラーはありますか？",options:["シルバー","ゴールド","ピンクゴールド","おまかせ"]},
{key:"budget",question:"最後に、予算の目安を教えてください。",options:["1万円以内","1～3万円","3万円以上","まだ決まっていない"]}];
let step=0,hasResults=false;const chat=document.getElementById("chat"),quick=document.getElementById("quick"),reply=document.getElementById("reply");
function addMsg(t,who="ai"){const r=document.createElement("div");r.className="msg "+(who==="user"?"user":"");const a=document.createElement("div");a.className="avatar";a.textContent=who==="user"?"👤":"AI";const b=document.createElement("div");b.className="bubble";b.textContent=t;r.append(a,b);chat.append(r);chat.scrollTop=chat.scrollHeight}
function setOptions(opts){quick.innerHTML="";opts.forEach(v=>{const b=document.createElement("button");b.textContent=v;b.onclick=()=>handle(v);quick.append(b)})}
function ask(){if(step<steps.length){addMsg(steps[step].question);setOptions(steps[step].options)}else finish()}
function start(){chat.innerHTML="";quick.innerHTML="";Object.keys(state).forEach(k=>state[k]="");step=0;hasResults=false;document.getElementById("resultCard").style.display="none";addMsg("こんにちは！AIジュエリーコンシェルジュです。会話しながら、お好みに合うジュエリーを一緒に探しましょう。");ask()}
function parse(t){const keys={scene:["普段使い","仕事・通勤","プレゼント","特別な日"],type:["ネックレス","リング","ピアス","ブレスレット"],design:["シンプル","上品","カジュアル","華やか"],color:["ピンクゴールド","ゴールド","シルバー"]};for(const [k,vs] of Object.entries(keys))for(const v of vs)if(t.includes(v))state[k]=v;const n=t.match(/(\d+(?:\.\d+)?)\s*万/);if(n){let a=+n[1]*10000;state.budget=a<=10000?"10000":a<=30000?"10000-30000":"30000"}const yen=t.match(/(\d[\d,]*)\s*円/);if(yen){let a=+yen[1].replace(/,/g,"");state.budget=a<=10000?"10000":a<=30000?"10000-30000":"30000"}}
function handle(v){if(!v.trim())return;addMsg(v,"user");quick.innerHTML="";reply.value="";if(v==="最初から"){start();return}if(hasResults){parse(v);showResults();addMsg("希望を更新しました。条件に合う商品を選び直しました。");return}const s=steps[step];if(s){if(v!=="まだ決まっていない"&&v!=="おまかせ"){if(s.key==="budget")state.budget=v==="1万円以内"?"10000":v==="1～3万円"?"10000-30000":v==="3万円以上"?"30000":"";else state[s.key]=v}step++;if(step<steps.length)setTimeout(ask,200);else setTimeout(finish,250)}else{parse(v);finish()}}
function finish(){addMsg("ありがとうございます！希望条件を整理して、合いそうな商品を探しますね。");showResults()}
function budgetOK(p){if(state.budget==="10000")return p.price<=10000;if(state.budget==="10000-30000")return p.price>=10000&&p.price<=30000;if(state.budget==="30000")return p.price>=30000;return true}
function match(p){let n=0,total=0;for(const k of ["scene","type","design","color"]){if(state[k]){total++;if(p[k]===state[k])n++}}if(state.budget){total++;if(budgetOK(p))n++}return total?Math.round(n/total*100):100}
function showResults(){hasResults=true;const chosen=products.map(p=>({...p,match:match(p)})).filter(p=>p.match>=60).sort((a,b)=>b.match-a.match).slice(0,6);document.getElementById("resultCard").style.display="block";document.getElementById("count").textContent=chosen.length+"件";const cond=[state.scene,state.type,state.design,state.color,({10000:"1万円以内","10000-30000":"1～3万円",30000:"3万円以上"})[state.budget]].filter(Boolean);document.getElementById("summary").textContent="検索条件："+(cond.length?cond.join("・"):"指定なし")+"。条件との一致度が高い商品を表示しています。";const grid=document.getElementById("grid");if(!chosen.length)grid.innerHTML='<p style="grid-column:1/-1;font-size:13px;line-height:1.8;color:#666">条件に近い商品が見つかりませんでした。希望を少し広げてみてください。</p>';else grid.innerHTML=chosen.map(p=>`<article class="product"><div class="visual"><span class="match">${p.match}% MATCH</span><div class="jewel ${p.color==="ピンクゴールド"?"pink":p.color==="シルバー"?"silver":""}">${shape(p.shape)}</div></div><h3>${p.name}</h3><div class="price">¥${p.price.toLocaleString()}</div><div class="meta">${p.type} / ${p.color} / ${p.design}</div><div class="reason">おすすめ理由：${why(p)}</div></article>`).join("");document.getElementById("resultCard").scrollIntoView({behavior:"smooth",block:"start"});addMsg(chosen.length?"こちらが今の希望に合いそうな候補です。気になる商品があれば、希望を追加したり変更したりできます。":"条件に近い商品が少ないようです。条件を変更して、もう一度探すこともできます。")}
function why(p){let a=[];if(state.type&&p.type===state.type)a.push("希望の種類");if(state.color&&p.color===state.color)a.push("希望カラー");if(state.design&&p.design===state.design)a.push("好みのデザイン");if(state.scene&&p.scene===state.scene)a.push("利用シーン");if(state.budget&&budgetOK(p))a.push("予算");return a.length?a.join("・")+"に合っています。":"全体の条件から選んだ候補です。"}
function shape(s){return({diamond:'<div class="diamond"></div>',ring:'<div class="ring"></div>',pearl:'<div class="pearl"></div>',circle:'<div class="circle"></div>',bar:'<div class="bar"></div>',stone:'<div class="stone"></div>'})[s]}
document.getElementById("send").onclick=()=>handle(reply.value);reply.addEventListener("keydown",e=>{if(e.key==="Enter")handle(reply.value)});document.getElementById("restart").onclick=start;document.getElementById("refine").onclick=()=>{addMsg("変更したい希望を自由に入力してください。例：やっぱりシルバーがいい、予算は1万円以内");reply.focus()};start();
</script></body></html>
